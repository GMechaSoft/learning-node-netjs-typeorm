services:
  postgres:
    image: postgres:16
    container_name: tareas-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tareas_db}
    ports:
      - "5432:5432"
    volumes:
      - tareas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tareas_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tareas_pgdata:
