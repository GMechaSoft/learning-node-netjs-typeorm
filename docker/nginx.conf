# Nginx que sirve el Frontend (SPA React) en el puerto 80 dentro de la imagen.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Compresion de texto
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Assets con hash en el nombre: cachear fuerte (Vite los genera inmutables)
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Favicon
        location = /favicon.svg {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # SPA: cualquier ruta no resuelta cae a index.html (navegacion client-side)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
